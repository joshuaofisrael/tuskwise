"lead":"Short answers to the questions people ask most about elephants, including some popular myths. Elephants are not afraid of mice in any proven way, they do not choose graveyards to die in, their trunks have about 150,000 muscle fascicles rather than 40,000 muscles, and most wild elephants do not live to 70. Each answer links to a fuller page.",
"faq_title":"Questions and answers",
"faq":[["How many species of elephant are there?","Three: the African savanna elephant (<i>Loxodonta africana</i>), the African forest elephant (<i>Loxodonta cyclotis</i>) and the Asian elephant (<i>Elephas maximus</i>). The IUCN has assessed the two African species separately since 2021. See the <a href=\"@/african-vs-asian-elephant.html\">comparison</a>."],
["Are elephants afraid of mice?","There is no good evidence for it. San Diego Zoo Wildlife Alliance notes that elephants coexist with animals of all sizes and that, because their eyesight is not very sharp, they may simply be startled by something small moving suddenly nearby."],
["Do elephants go to graveyards to die?","No. Very old elephants with worn out final molars often stay near swamps and marshes, where soft plants are easier to chew, and may die there. San Diego Zoo Wildlife Alliance says this habit probably gave rise to the graveyard myth."],
["Do elephants really never forget?","Not literally, but they have excellent long term social and spatial memory. Studies in Kenya and Tanzania link older matriarchs' knowledge to better decisions and calf survival. Read <a href=\"@/blog/do-elephants-really-never-forget.html\">Do elephants really never forget?</a>"],
["Does an elephant's trunk have 40,000 muscles?","That figure is widely repeated, but the zoos that study elephants report differently: San Diego Zoo Wildlife Alliance describes eight major muscles on each side of the trunk and about 150,000 muscle fascicles in total, and the Smithsonian's National Zoo gives about 150,000 muscle units. See <a href=\"@/anatomy.html#trunk\">elephant anatomy</a>."],
["How long do elephants live?","Less than often claimed. San Diego Zoo Wildlife Alliance gives a median life expectancy of 38 to 47 years, and the Smithsonian's National Zoo notes that data suggest African elephants rarely live past 50 and Asian elephants typically into their mid 50s, though individuals vary."],
["How long is an elephant pregnant?","About 22 months; the Smithsonian gives 21.5 to 22 months for Asian elephants, the longest pregnancy of any animal. See <a href=\"@/blog/how-long-are-elephants-pregnant.html\">How long are elephants pregnant?</a>"],
["Do elephants sleep standing up?","Often, yes. A study of two wild African elephant matriarchs found they slept about two hours a day, both standing and lying down, but lay down only every third or fourth day. Zoo elephants commonly lie down for a few hours at night."],
["Do elephants drink through their trunks like a straw?","No. They suck water part way up the trunk, then curl it to the mouth and pour the water in."],
["Is the elephant the largest animal?","It is the largest living land animal; the African savanna elephant is the biggest of the three species. Some whales, such as the blue whale, are much larger."],
["Do tusks grow back?","Tusks keep growing throughout life, so a broken tip is gradually replaced by new growth from the base. But about a third of each tusk sits inside the skull, around a pulp cavity containing nerve tissue, so a tusk cannot be removed without seriously harming the elephant, which is why poachers kill elephants for ivory."],
["Are white elephants a separate kind of elephant?","No. So called white elephants are Asian elephants with unusually pale skin. Many older Asian elephants also develop pinkish, depigmented patches on the ears, face and trunk; the Smithsonian says this is thought to depend on genetics, nutrition and habitat."],
["Can elephants swim?","Yes. Elephants swim well, using the trunk as a snorkel. San Diego Zoo Wildlife Alliance notes that elephants in India's Andaman Islands swim across the sea between islands."]],
